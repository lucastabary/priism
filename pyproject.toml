[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "priism"
version = "0.2.0"
description = "Stem separation engine for MyMixxx: multi-model separation, lossless stems + manifest, NI .stem.mp4 export"
requires-python = ">=3.11"
# The engine itself: decoding, manifest, residual, export. Models come with extras.
dependencies = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12"]

[project.optional-dependencies]
# Demucs models (htdemucs, htdemucs_ft) run in-process through the demucs package.
demucs = ["demucs>=4.0", "torch", "torchaudio"]
# Research code (priism.lab): generators, attractor separator, pod tooling.
lab = ["pedalboard>=0.9", "pyyaml", "torch"]
# Pretrained models through the UVR engine, used by the lab's legacy `separate`.
# audioread is imported by audio-separator but not declared by it (0.47).
lab-separate = ["audio-separator[gpu]>=0.30", "audioread"]
lab-separate-cpu = ["audio-separator[cpu]>=0.30", "audioread"]
# Speeds up the 303 filter loop roughly 50x; the pure Python fallback is used otherwise.
fast = ["numba>=0.59"]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
priism = "priism.cli:main"
priism-lab = "priism.lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
priism = ["engine/profiles/*.toml", "engine/schema/*.json"]
"priism.lab" = ["profiles/*.toml", "listen.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
