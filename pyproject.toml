[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "priism"
version = "0.1.0"
description = "ML stem separation for DJ mixing, starting with dub and acid"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12"]

[project.optional-dependencies]
# Pretrained separation models (RoFormer, MDX, Demucs) through the UVR engine.
# audioread is imported by audio-separator but not declared by it (0.47).
separate = ["audio-separator[gpu]>=0.30", "audioread"]
separate-cpu = ["audio-separator[cpu]>=0.30", "audioread"]
# Speeds up the 303 filter loop roughly 50x; the pure Python fallback is used otherwise.
fast = ["numba>=0.59"]
# Checkpoint preparation for fine-tuning (MSST itself is installed by pod/setup.sh).
train = ["pyyaml", "torch"]
dev = ["pytest>=8"]

[project.scripts]
priism = "priism.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
priism = ["profiles/*.toml"]
