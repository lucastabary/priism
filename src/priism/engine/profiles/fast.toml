# The usual 4 stems with a single Hybrid Transformer Demucs: about 4x faster than
# `standard` (htdemucs_ft runs one fine-tuned model per stem), slightly lower quality.
# What the four stems leave of the mix (a few tenths of a percent) goes to the residual.
name = "fast"
version = "1"
description = "htdemucs (single model, ~4x faster than standard): drums, bass, other, vocals"
suggested_slots = [["drums"], ["bass"], ["other", "residual"], ["vocals"]]

[[steps]]
input = "mix"
model = "demucs:htdemucs"
outputs = [
  { id = "drums", kind = "drums", label = "Drums", from = ["drums"] },
  { id = "bass", kind = "bass", label = "Bass", from = ["bass"] },
  { id = "other", kind = "other", label = "Other", from = ["other"] },
  { id = "vocals", kind = "vocals", label = "Vocals", from = ["vocals"] },
]
